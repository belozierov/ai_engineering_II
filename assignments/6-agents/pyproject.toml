[project]
name = "ops-copilot-capstone"
version = "0.1.0"
description = "LangChain v1 Ops Copilot capstone for the AI Engineering course"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "langchain>=1.3.9,<1.4",
    "langchain-core>=1.4,<1.5",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.2.5,<1.3",
    "qdrant-client>=1.15.1,<2",
]

[project.optional-dependencies]
ui = [
    "chainlit>=2.9,<3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["eval/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"eval/tests/**/*.py" = ["S101"]

[tool.uv]
package = false
